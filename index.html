<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Starter</title>
    <meta name="description" content="A TheKrystalShip web app." />
    <meta name="theme-color" content="#0B0F14" />

    <!-- The manifest is what Android's "Install app" reads. It names no orientation: any value there
         overrides the phone's own rotation lock in the installed app. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Safari reads none of the manifest's install details; these are its home-screen title and
         standalone behaviour. The icons, the launch screens and the splash are the design system's
         (siteIdentity in vite.config.js). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Starter" />
    <meta name="application-name" content="Starter" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
